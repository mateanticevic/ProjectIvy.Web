# Docker
# Build a Docker image
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
  branches:
    include:
    # Every branch except master uses the preview stack, regardless of its name.
    - '*'
  tags:
    exclude:
    - '*'

resources:
- repo: self

variables:
  imageRepository: 'mateanticevic/project-ivy-web'

